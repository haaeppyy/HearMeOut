name: EchoSign
options:
  bundleIdPrefix: dev.echo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AgoraRtcEngine_iOS:
    url: https://github.com/AgoraIO/AgoraRtcEngine_iOS
    from: "4.3.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  EchoSign:
    type: application
    platform: iOS
    sources:
      - path: EchoSign
    dependencies:
      - package: AgoraRtcEngine_iOS
        product: RtcBasic
    info:
      path: EchoSign/Info.plist
      properties:
        CFBundleDisplayName: EchoSign
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: EchoSign uses the microphone to transmit your voice during calls and to enable live captions.
        NSSpeechRecognitionUsageDescription: EchoSign uses speech recognition to turn what the other party says during a call into live text captions, and to synthesize what you type aloud.
        UIBackgroundModes:
          - voip
          - audio
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: H57W4Q745B
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"