name: HearMeOut
options:
  bundleIdPrefix: dev.echo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AgoraRtcEngine_iOS:
    url: https://github.com/AgoraIO/AgoraRtcEngine_iOS
    from: "4.3.0"
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.11.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    ENABLE_DEBUG_DYLIB: "NO"
targets:
  HearMeOut:
    type: application
    platform: iOS
    sources:
      - path: HearMeOut
    dependencies:
      - package: AgoraRtcEngine_iOS
        product: RtcBasic
      - package: supabase-swift
        product: Supabase
      - package: GRDB
        product: GRDB
    info:
      path: HearMeOut/Info.plist
      properties:
        CFBundleDisplayName: HearMeOut
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: HearMeOut uses the microphone to transmit your voice during calls and to enable live captions.
        NSSpeechRecognitionUsageDescription: HearMeOut uses speech recognition to turn what the other person says during a call into live text captions, and to synthesize what you type aloud.
        UIBackgroundModes:
          - voip
          - audio
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: H57W4Q745B
        # The bundle ID stays dev.echo.EchoSign even though the app is called
        # HearMeOut: it is the APNs topic and the provisioned App ID. Changing
        # it would break PushKit registration and the existing profile.
        PRODUCT_BUNDLE_IDENTIFIER: dev.echo.EchoSign
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_ENTITLEMENTS: HearMeOut/Entitlements/HearMeOut.entitlements
      configs:
        Debug:
          # iOS 27 Simulator rejects the bundled Agora dynamic frameworks
          # when an unsigned CLI build is installed. Ad-hoc-sign simulator
          # artifacts; this conditional never applies to a real iPhone,
          # which continues to use Automatic development signing.
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
  HearMeOutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HearMeOutTests
    dependencies:
      - target: HearMeOut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.echo.EchoSignTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HearMeOut.app/HearMeOut"
        BUNDLE_LOADER: "$(TEST_HOST)"
